version: '3.8'

services:
  backend:
    build:
      context: ../$BACKEND_DIR
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:80" # Nginx serves on port 80 inside container
    depends_on:
      - backend
    restart: always
